<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#476f95">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <meta name="description" content="The First Threshold of Brujo Ryan's VR Labyrinth. Spirits live here. Mind your manners.">
  <title>Brujo Ryan's Labyrinth | The First Threshold</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./story.css">
</head>
<body>
  <div id="stage" aria-label="Interactive three-dimensional labyrinth entrance"></div>

  <header class="mast">
    <span class="subtitle" style="margin-left:auto">THE FIRST THRESHOLD · 001</span>
  </header>

  <section id="threshold" class="overlay">
    <div class="welcome">
      <p class="eyebrow">A STRANGE LITTLE KINGDOM</p>
      <h1>BRUJO RYAN'S<br>LABYRINTH</h1>
      <p class="motto">Spirits live here. Mind your manners.</p>
      <p>Beyond these stones: a maze that remembers, a Tree at its heart, and something enormous sleeping in the moat.</p>
      <button id="begin">Cross the Threshold →</button>
      <p class="small">Headphones encouraged · No account · No tracking · No walking required</p>
    </div>
  </section>

  <div id="scene-veil" class="scene-veil" hidden role="status" aria-live="polite">
    <p id="scene-veil-text"></p>
  </div>

  <aside id="dialogue" class="dialogue" hidden aria-live="polite">
    <p id="speaker"></p>
    <p id="speech"></p>
    <div id="choices" class="choices" role="group" aria-label="Conversation choices"></div>
    <button id="dismiss">Close ×</button>
  </aside>

  <nav class="controls" aria-label="Scene controls" hidden>
    <button id="goblin">Meet the Goblin</button>
    <button id="faerie">Ask the Faerie</button>
    <button id="gate">Approach the Gate</button>
    <button id="notices">Goblin Notices</button>
    <button id="hedge" hidden>Consult the Hedge</button>
    <button id="return-gate" hidden>← Return Through the Gate</button>
    <button id="counting-gate" hidden>The Counting House →</button>
    <button id="ledger" hidden>Meet the Ledger</button>
    <button id="nib" hidden>Bother Nib</button>
    <button id="stamp" hidden>Face the Stamp</button>
    <button id="seven" hidden>Address the Seven</button>
    <button id="bear-door" hidden>The Bear's Door</button>
    <button id="oracle-door" hidden>The Oracle's Door</button>
    <button id="kore" hidden>Consult Kore</button>
    <button id="barometer" hidden>Inspect the Barometer</button>
    <button id="answer-jar" hidden>Open the Jar of Leftover Answers</button>
    <button id="bell-chime" hidden>Listen to the Hundred Small Bells</button>
    <button id="oracle-return" hidden>← Back to the Counting House</button>
    <button id="department-door" hidden>The Department of Unnecessary Doors →</button>
    <button id="picklesworth" hidden>Meet Mr. Picklesworth</button>
    <button id="union-door" hidden>Consult the Union Door</button>
    <button id="office-bell" hidden>Ring the Emergency Bell</button>
    <button id="office-return" hidden>← Back to the Counting House</button>
    <button id="keep-out-door" hidden>The KEEP OUT Door</button>
    <button id="attendant" hidden>The Attendant</button>
    <button id="basin" hidden>The Basin</button>
    <button id="shrine-return" hidden>← Back to the Unnecessary Doors</button>
    <button id="counting-return" hidden>← Back to the Hedges</button>
    <button id="quillon" hidden>Whisper to the Otter</button>
    <button id="river-kettle" hidden>Negotiate with the Kettle</button>
    <button id="pell" hidden>Approach Mrs. Pell</button>
    <button id="reading-chair" hidden>The Reading Chair</button>
    <button id="sentence-bucket" hidden>The Bucket of Sentences</button>
    <button id="water-gate" hidden>Approach the Old Stone Water-Gate</button>
    <button id="bridge-tender" hidden>Speak to Bram</button>
    <button id="snoring-buoy" hidden>Read the Snoring Buoy</button>
    <button id="tax-box" hidden>Inspect the Tax-Exemption Box</button>
    <button id="moat-return" hidden>← Back to the River House</button>
    <button id="river-return" hidden>← Back to the Counting House</button>
    <button id="sound">Sound: On</button>
    <button id="reset">Look to Gate</button>
  </nav>

  <p id="hint" hidden></p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/story-ui.js"></script>
  <script type="module" src="./src/navigation.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
